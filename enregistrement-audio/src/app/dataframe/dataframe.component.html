<section class="dataframe-section" >
  <h2>{{export_title}}</h2>
  <div class="table-header">
    <div class="button-container">
      <button (click)="exporterExcel()" >
        📤 Exporter en Excel
      </button>
      <button (click)="modeRechercheAvancee = !modeRechercheAvancee">
        🔍 Recherche avancée
      </button>
      <ng-content select="[extra-button]"></ng-content>
    </div>
  </div>
  <div [ngStyle]="{'max-height': table_max_height}" class="table-container">
    <table>
      <thead>
        <tr>
          <th *ngFor="let col of colonnes" (click)="trier(col)" style="cursor:pointer">
            {{ traductions[col] || col }}
            <span *ngIf="col === colonne_triee">
              {{ ordre_tri === 'asc' ? '▲' : '▼' }}
            </span>
          </th>
        </tr>
        <tr *ngIf="!modeRechercheAvancee">
          <th *ngFor="let col of colonnes">
            <ng-container [ngSwitch]="filtres[col].type">
              <!-- Texte -->
              <input *ngSwitchCase="'text'"
                     type="text"
                     [(ngModel)]="filtres[col].value"
                     (input)="filtrer()"
                     placeholder="Filtrer..." />
        
              <!-- Nombre -->
              <div *ngSwitchCase="'number'" style="display:flex; flex-direction: column;">
                <input type="number"
                       [(ngModel)]="filtres[col].min"
                       (input)="filtrer()"
                       placeholder="Min" />
                <input type="number"
                       [(ngModel)]="filtres[col].max"
                       (input)="filtrer()"
                       placeholder="Max" />
              </div>
        
              <!-- Date -->
              <div *ngSwitchCase="'date'" style="display:flex; flex-direction: column;">
                <input type="date"
                       [(ngModel)]="filtres[col].min"
                       (input)="filtrer()" />
                <input type="date"
                       [(ngModel)]="filtres[col].max"
                       (input)="filtrer()" />
              </div>
            </ng-container>
          </th>
        </tr>
        <tr *ngIf="modeRechercheAvancee">
          <th *ngFor="let col of colonnes">
            <div class="tags">
              <span *ngFor="let val of filtres_avances[col]; let i = index" class="tag">
                {{ val }}
                <button (click)="retirerFiltre(col, i)">×</button>
              </span>
            </div>
            <input type="text" [(ngModel)]="valeurs_temp[col]" (keyup.enter)="ajouterFiltre(col)" placeholder="Ajouter filtre" />
          </th>
        </tr>
        <tr *ngIf="modeRechercheAvancee">
          <th *ngFor="let col of colonnes">
            <div class="copy-wrapper">
              <button (click)="copierColonne(col)">
                📋 Copier
              </button>
              <span class="copied-message" *ngIf="copied[col]">Copié ✅</span>
            </div>
          </th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let ligne of data_filtered">
          <td *ngFor="let col of colonnes">{{ ligne[col] }}</td>
        </tr>
      </tbody>
    </table>
  </div>
  <div class="table-footer">
    {{ data_filtered.length }} ligne{{ data_filtered.length > 1 ? 's' : '' }}.
  </div>
</section>
