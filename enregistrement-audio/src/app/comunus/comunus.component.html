<div class="tool-page">

  <div class="tool-header">
    <h1>Comunus</h1>

    <nav class="tool-menu">
        <a *ngFor="let page of pages"
            [routerLink]="page.path"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }">
            
            {{ page.label }}
            
        </a>
    </nav>
  </div>

  <router-outlet></router-outlet>

</div>
