<section class="email-section">
    <h2>📧 Préparation du publipostage</h2>
    <p>Les emails filtrés apparaîtront ci-dessous. Copiez ou utilisez le bouton pour les exporter.</p>
    <div class="textarea-row">
        <textarea [(ngModel)]="email_str" id="emailTextarea" rows="4" readonly></textarea>
        <button class="btn-copy" (click)="copy_emails_to_clipboard()">📋 Copier</button>
        <div class="copy-notification" [class.show]="copied">
            ✅ Copié !
        </div>
    </div>
    <div class="button-container">
        <button (click)="exporter_liste_email()" class="btn-secondary">📤 Exporter les emails pour publipostage</button>
        <button (click)="exporter_liste_without_valid_email()" class="btn-secondary">📤 Exporter les lignes sans email valide</button>
        <button (click)="exporter_liste_with_invalid_email()" class="btn-secondary">📤 Exporter les lignes avec email invalide</button>
    </div>
</section>
